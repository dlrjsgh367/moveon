# docker.sock 앞단 프록시.
# Traefik의 Docker provider가 API 1.24로 붙는데 이 데몬은 min 1.40이라 거부한다.
# 요청 경로의 버전 접두어(/v1.24/... 또는 협상된 아무 버전)를 데몬이 받는 /v1.44/ 로 바꿔 넘긴다.
# (docker API는 상위 호환이라 1.44로 올려 보내면 정상 처리됨)
user root;              # docker.sock(root 소유) 접근용
events {}
http {
    upstream docker { server unix:/var/run/docker.sock; }

    server {
        listen 2375;
        location / {
            rewrite ^/v[0-9.]+/(.*)$ /v1.44/$1 break;   # 버전 접두어만 치환
            proxy_pass http://docker;
            proxy_http_version 1.1;
            proxy_set_header Connection "";             # events 스트리밍용 keep-alive
            proxy_buffering off;                         # 이벤트 즉시 전달
            proxy_read_timeout 3600s;                    # 장수명 watch 연결 유지
        }
    }
}
