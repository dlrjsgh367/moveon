spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/notification
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
server:
  port: 8080
