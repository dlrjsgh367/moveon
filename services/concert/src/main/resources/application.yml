spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/concert
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none   # 스키마는 infra/mysql/init 이 만든다
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
reservation:
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:600}
payment:
  url: ${PAYMENT_URL:http://localhost:8081}
